name: Docs deploy

# Every push to main builds the docs into docs/dist and publishes them with GitHub Pages (Settings >
# Pages > Source must be "GitHub Actions"). It needs no secret: Pages authenticates the workflow
# itself, and the `github-pages` environment only lets main deploy. The docs are their own pnpm
# project (docs/pnpm-lock.yaml), separate from the package.
on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/docs-deploy.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # the deployment
  id-token: write # proves to Pages that this workflow is the one deploying

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist
      - id: deployment
        uses: actions/deploy-pages@v4
